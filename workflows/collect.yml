name: Collect SPCX data

on:
  schedule:
    # Every 15 minutes around US trading hours (covers EDT and EST), Mon-Fri.
    # 13:00-22:00 UTC spans 9:00-17:00 ET in summer and 8:00-16:00 ET in winter.
    - cron: "*/15 13-22 * * 1-5"
    # Hourly during extended hours (pre-market from 4:00 ET, after-hours to 20:00 ET).
    - cron: "0 8-12,23 * * 1-5"
    # Nightly catch-up after the after-hours session closes (00:15 UTC = 20:15 ET).
    - cron: "15 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-spcx
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect data
        run: python collect.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "Update SPCX data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Another run may have pushed meanwhile; rebase before pushing.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
