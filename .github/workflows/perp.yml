name: Collect perp data

on:
  schedule:
    # Hyperliquid SPCX perp trades 24/7, so poll every 15 minutes around the
    # clock. The candleSnapshot endpoint serves ~3.5 days back, so even a long
    # schedule delay loses nothing.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-perp
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pandas

      - name: Collect perp candles
        run: python spcx_collector.py --coin xyz:SPCX --interval 1m --outdir data/perp

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/perp/
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "Update SPCX perp data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Another run may have pushed meanwhile; rebase before pushing.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
