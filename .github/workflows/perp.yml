name: Collect perp data

on:
  schedule:
    # Hyperliquid SPCX perp trades 24/7, so poll every 15 minutes around the
    # clock. The candleSnapshot endpoint serves ~3.5 days back, so even a long
    # schedule delay loses nothing.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-perp
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pandas

      # 1m is the finest series; 30m/1h/1d are the recovery tiers behind it,
      # with 104/208/5000-day windows instead of 3.5 days. One run per
      # interval, because the collector takes a single --interval.
      - name: Collect perp candles
        run: |
          for iv in 1m 30m 1h 1d; do
            python spcx_collector.py --coin xyz:SPCX --interval "$iv" --outdir data/perp
          done

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/perp/
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "Update SPCX perp data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Another run may have pushed meanwhile; rebase before pushing.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
