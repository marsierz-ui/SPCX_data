name: Collect stock data

on:
  schedule:
    # Every 15 minutes around US trading hours (covers EDT and EST), Mon-Fri.
    # 13:00-22:00 UTC spans 9:00-17:00 ET in summer and 8:00-16:00 ET in winter.
    - cron: "*/15 13-22 * * 1-5"
    # Hourly during extended hours (pre-market from 4:00 ET, after-hours to 20:00 ET).
    - cron: "0 8-12,23 * * 1-5"
    # Nightly catch-up after the after-hours session closes (00:15 UTC = 20:15 ET).
    - cron: "15 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-stock
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect data
        env:
          # Add these in repo Settings → Secrets and variables → Actions.
          # When unset, the collector falls back to Yahoo 1-minute bars.
          LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
          LSEG_MACHINE_ID: ${{ secrets.LSEG_MACHINE_ID }}
          LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
        run: python collect.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "Update SPCX data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Another run may have pushed meanwhile; rebase before pushing.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
